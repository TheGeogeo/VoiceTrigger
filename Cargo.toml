[package]
name = "voice-trigger"
version = "0.1.0"
edition = "2021"
rust-version = "1.72"
description = "Local voice triggers and ChatGPT dictation for Windows"
license = "MIT"

[dependencies]
serde = { version = "=1.0.188", features = ["derive"] }
serde_json = "=1.0.105"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.48.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Media_Speech",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
